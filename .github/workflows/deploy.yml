name: CI/CD Pipeline - Docker

on:
  push:
    branches:
      - Prod

jobs:
  # ====== TEST ======
  Test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission to mvnw
      run: chmod +x ./mvnw

    - name: Test
      run: ./mvnw test

  # ====== BUILD ======
  Build:
    runs-on: ubuntu-latest
    needs: Test

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission to mvnw
      run: chmod +x ./mvnw

    - name: Build JAR
      run: ./mvnw clean package -DskipTests=true

  # ====== DEPLOY ======
  Deploy:
    runs-on: ubuntu-latest
    needs: Build

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up SSH Agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.DEPLOY_KEY }}

    - name: Rsync to Server
      run: |
        rsync -e "ssh -p 21" -avz --exclude '.git' --exclude 'node_modules' --exclude 'target' ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.SERVER_PATH }}

    - name: Deploy on Server
      run: |
        ssh -p 21 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "cd ${{ secrets.SERVER_PATH }} && docker compose up -d --build"
