name: CI/CD Pipeline - Docker

on:
  push:
    branches:
      - Prod

jobs:
  # ====== TEST ======
  Test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Create application-test.yml
      run: |
        mkdir -p src/main/resources
        echo -e "${{ secrets.APPLICATION_TEST_YML }}" > src/main/resources/application-test.yml

    - name: Verify application-test.yml
      run: |
        ls -lah src/main/resources
        cat src/main/resources/application-test.yml
  
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Test
      run: mvn test

    #스니펫 업로드
    - name: Upload generated-snippets
      uses: actions/upload-artifact@v4.6.1
      with:
        name: generated-snippets
        path: target/generated-snippets
  # ====== BUILD ======
  Build:
    runs-on: ubuntu-latest
    needs: Test

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    #artifact에 업로드된 스니펫들을 받아옴
    - name: Download generated-snippets
      uses: actions/download-artifact@v4.1.9
      with:
        name: generated-snippets
        path: target/generated-snippets

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build JAR
      run: mvn clean package -DskipTests=true

  # ====== DEPLOY ======
  Deploy:
    runs-on: ubuntu-latest
    needs: Build

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up SSH Agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.DEPLOY_KEY }}

    - name: Rsync to Server
      run: |
        rsync -e "ssh -p 21" -avz --exclude '.git' --exclude 'node_modules' --exclude 'target' ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:${{ secrets.SERVER_PATH }}

    - name: Deploy on Server
      run: |
        ssh -p 21 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "cd ${{ secrets.SERVER_PATH }} && docker compose up -d --build"
