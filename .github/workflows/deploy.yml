name: CI/CD Pipeline - Docker

on:
  push:
    branches:
      - Prod

jobs:
  # ====== BUILD & TEST 통합 ======
  Build-and-Test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Create application-test.yml
        run: |
          mkdir -p src/main/resources
          echo -e "${{ secrets.APPLICATION_TEST_YML }}" > src/main/resources/application-test.yml

      - name: Create application.yml for build
        run: |
          echo -e "${{ secrets.APPLICATION_YML }}" > src/main/resources/application.yml

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify, Generate Docs & Build JAR
        run: |
          mvn clean verify -DskipTests=false
          mvn package -DskipTests=true

      - name: Move JAR to root as app.jar
        run: cp target/*.jar ./app.jar

      - name: Upload app.jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: app.jar

  # ====== DEPLOY ======
  Deploy:
    runs-on: ubuntu-latest
    needs: Build-and-Test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Download app.jar artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: .

      - name: Create docker-compose.yml for deploy
        run: |
          echo -e "${{ secrets.DOCKER_COMPOSE }}" > ./docker-compose.yml

      - name: Set up SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -p 21 ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Rsync selected files to Server
        run: |
          rsync -e "ssh -p 21" -avz --rsync-path="mkdir -p '${{ secrets.SERVER_DIR_PATH }}' && rsync" \
          app.jar Dockerfile docker-compose.yml \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:"${{ secrets.SERVER_DIR_PATH }}/"

      - name: Deploy on Server
        run: |
          ssh -p 21 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
          "cd '${{ secrets.SERVER_DIR_PATH }}' && docker compose -f app-compose.yml down && docker compose -f app-compose.yml up -d --build"