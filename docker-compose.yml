version: '3.8'

services:
  # MariaDB 컨테이너 정의
  mariadb:
    image: mariadb:10.11.8
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: wmdyun97%
      MYSQL_DATABASE: inven
      MYSQL_USER: blackcow
      MYSQL_PASSWORD: blackcow25!
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  # Spring Boot App 컨테이너 정의
  app:
    build: .
    container_name: springboot_app
    depends_on:
      - mariadb
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: default
    restart: always

volumes:
  db_data:
